<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KAHIS — คู่มือการใช้งาน</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1c1c1c;
      --muted: #5a5a5a;
      --line: #1a9a8a;
      --line-soft: #b7ddd8;
      --paper: #f4f6f5;
      --panel: #ffffff;
      --teal: #0d9488;
      --teal-deep: #0f766e;
      --ku-green: #006633;
      --soon-ring: #b5b5b5;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: "Sarabun", sans-serif;
      color: var(--ink);
      background-color: var(--paper);
      background-image:
        linear-gradient(135deg, rgba(13, 148, 136, .06) 0 18%, transparent 18% 100%),
        linear-gradient(225deg, rgba(0, 102, 51, .05) 0 16%, transparent 16% 100%),
        linear-gradient(45deg, transparent 78%, rgba(13, 148, 136, .05) 78%),
        linear-gradient(315deg, transparent 80%, rgba(0, 102, 51, .04) 80%);
      background-repeat: no-repeat;
      background-size: 100% 100%;
    }

    .page {
      width: min(980px, calc(100% - 2.5rem));
      margin: 0 auto;
      padding: 1.75rem 0 3rem;
      position: relative;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.75rem;
    }

    .topbar-brand {
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--ku-green);
      padding-top: .35rem;
    }

    .topbar-logo {
      height: 58px;
      width: auto;
      display: block;
      object-fit: contain;
    }

    .hero {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .hero h1 {
      font-size: clamp(1.55rem, 3.2vw, 2.05rem);
      font-weight: 700;
      letter-spacing: .01em;
      color: var(--ink);
      line-height: 1.25;
    }

    .hero p {
      margin: .65rem auto 0;
      max-width: 38rem;
      font-size: .95rem;
      color: var(--muted);
      line-height: 1.65;
    }

    .hero p + p {
      margin-top: .25rem;
    }

    .portal-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 2rem 1.25rem;
      justify-items: center;
      align-items: start;
    }

    .portal-item {
      width: 100%;
      max-width: 9.5rem;
      text-align: center;
      text-decoration: none;
      color: inherit;
      background: none;
      border: none;
      cursor: pointer;
      font: inherit;
      padding: 0;
    }

    .portal-item:focus-visible .portal-ring {
      outline: 2px solid var(--teal-deep);
      outline-offset: 4px;
    }

    .portal-ring {
      width: 6.6rem;
      height: 6.6rem;
      margin: 0 auto .85rem;
      border-radius: 50%;
      border: 2px solid var(--teal);
      background: var(--panel);
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: .18rem;
      transition: border-color .2s ease, transform .2s ease, box-shadow .2s ease;
    }

    .portal-item:hover .portal-ring,
    .portal-item:focus-visible .portal-ring {
      border-color: var(--teal-deep);
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(15, 118, 110, .12);
    }

    .portal-item.is-soon {
      cursor: default;
    }

    .portal-item.is-soon .portal-ring {
      border-color: var(--soon-ring);
      background: #f3f4f6;
    }

    .portal-item.is-soon:hover .portal-ring {
      transform: none;
      box-shadow: none;
      border-color: #a3a3a3;
    }

    .portal-ring img.icon-poodle {
      display: block;
      object-fit: contain;
      object-position: center;
    }

    .portal-ring img.icon-poodle-chapter {
      width: 6.2rem;
      height: 6.2rem;
    }

    .portal-ring img.icon-poodle-soon {
      width: 6.15rem;
      height: 6.15rem;
      transform: scale(1.06);
      opacity: .5;
    }

    .portal-label {
      font-size: .9rem;
      font-weight: 700;
      line-height: 1.35;
      color: var(--ink);
    }

    .portal-sub {
      display: block;
      margin-top: .2rem;
      font-size: .72rem;
      font-weight: 600;
      letter-spacing: .04em;
      color: var(--teal-deep);
    }

    .portal-item.is-soon .portal-label,
    .portal-item.is-soon .portal-sub {
      color: var(--soon-ring);
    }

    .footer-note {
      margin-top: 2.75rem;
      text-align: center;
      font-size: .78rem;
      color: var(--muted);
    }

    @media (max-width: 860px) {
      .portal-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.6rem 1rem; }
      .portal-ring { width: 5.8rem; height: 5.8rem; }
      .portal-ring img.icon-poodle-chapter { width: 5.45rem; height: 5.45rem; }
      .portal-ring img.icon-poodle-soon { width: 5.4rem; height: 5.4rem; }
    }

    @media (max-width: 560px) {
      .portal-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .topbar-logo { height: 48px; }
    }
  </style>
</head>
<body data-chapter-base="" data-asset-base="assets/">

<div class="page">
  <div class="topbar">
    <div class="topbar-brand">KAHIS User Manual</div>
    <img
      class="topbar-logo"
      src="https://vet.ku.ac.th/storage/setting/logo-1750664984.svg"
      alt="คณะสัตวแพทยศาสตร์ มหาวิทยาลัยเกษตรศาสตร์"
      width="160"
      height="58"
    >
  </div>

  <header class="hero">
    <h1>คู่มือการใช้งาน KAHIS</h1>
    <p>ระบบเวชระเบียนอิเล็กทรอนิกโรงพยาบาลสัตว์ มหาวิทยาลัยเกษตรศาสตร์</p>
    <p>เลือกบทเพื่อเปิดคู่มือและส่งออก PDF</p>
  </header>

  <nav class="portal-grid" id="portalGrid" aria-label="รายการบทคู่มือ"></nav>

  <p class="footer-note">โรงพยาบาลสัตว์ มหาวิทยาลัยเกษตรศาสตร์ · Version 2026.08.14.01</p>
</div>

<script>
  const CHAPTERS = [
    {
      id: '01',
      code: 'VR001',
      title: 'ส่วนประกอบหลักของ UI',
      file: 'chapter-01-ui-components.html'
    },
    {
      id: '02',
      code: 'VR004',
      title: 'ใบบันทึกการตรวจ',
      file: 'chapter-02-exam-card-viewer.html'
    },
    {
      id: '03',
      code: 'VR005',
      title: 'การลงข้อมูลในใบบันทึกการตรวจ',
      file: 'chapter-03-exam-card-editor.html'
    }
  ];

  /* จำนวนช่องในกริดแนวตัวอย่าง — ช่องว่างเป็น Under Construction */
  const GRID_SLOTS = 8;

  const chapterBase = document.body.getAttribute('data-chapter-base') || '';
  const assetBase = document.body.getAttribute('data-asset-base') || 'assets/';

  function chapterHref(ch) {
    return chapterBase + ch.file;
  }

  function makeChapterItem(ch) {
    const a = document.createElement('a');
    a.className = 'portal-item';
    a.href = chapterHref(ch);
    a.target = '_blank';
    a.rel = 'noopener';
    a.innerHTML =
      '<div class="portal-ring">' +
        '<img class="icon-poodle icon-poodle-chapter" src="' + assetBase + 'poodle-current-clean.svg" alt="">' +
      '</div>' +
      '<div class="portal-label">บทที่ ' + ch.id + '<br>' + ch.title + '</div>' +
      '<span class="portal-sub">' + ch.code + '</span>';
    return a;
  }

  function makeSoonItem() {
    const el = document.createElement('div');
    el.className = 'portal-item is-soon';
    el.setAttribute('aria-disabled', 'true');
    el.innerHTML =
      '<div class="portal-ring">' +
        '<img class="icon-poodle icon-poodle-soon" src="' + assetBase + 'poodle-under-construction.png" alt="">' +
      '</div>' +
      '<div class="portal-label">บทถัดไป</div>' +
      '<span class="portal-sub">Under Construction</span>';
    return el;
  }

  function render() {
    const grid = document.getElementById('portalGrid');
    grid.innerHTML = '';
    CHAPTERS.forEach(function (ch) {
      grid.appendChild(makeChapterItem(ch));
    });
    const soonCount = Math.max(0, GRID_SLOTS - CHAPTERS.length);
    for (var i = 0; i < soonCount; i++) {
      grid.appendChild(makeSoonItem());
    }
  }

  render();
</script>

</body>
</html>
