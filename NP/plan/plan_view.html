<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KAHIS - Plan View</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f0f2f5; color: #333; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }
  .plan-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 18px; border: 1px solid #93c5fd; border-radius: 999px;
    font-size: 14px; background: #eff6ff; color: #1d4ed8;
    font-family: inherit; cursor: pointer; font-weight: 500; transition: all .15s;
  }
  .plan-badge:hover { background: #dbeafe; border-color: #60a5fa; }
  .plan-badge .dot { width: 8px; height: 8px; border-radius: 50%; background: #3b82f6; }

  .modal-overlay {
    display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,.4); z-index: 1000; align-items: center; justify-content: center;
  }
  .modal-overlay.show { display: flex; }
  .modal-box {
    background: #f0f2f5; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.3);
    width: 1400px; max-width: 95%; height: 95vh; max-height: 95vh;
    overflow: hidden; padding: 16px; position: relative;
    display: flex; flex-direction: column;
  }
  .modal-close {
    background: #fff; border: 1px solid #fca5a5; border-radius: 8px;
    padding: 6px 12px; font-size: 13px; cursor: pointer; color: #dc2626;
    font-family: inherit; font-weight: 500;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .modal-close:hover { background: #fef2f2; border-color: #f87171; }

  .plan-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px; flex-shrink: 0;
  }
  .plan-header h1 {
    font-size: 18px; font-weight: 600; color: #1e293b;
  }
  .plan-body {
    flex: 1; background: #fff; border-radius: 12px;
    padding: 24px; overflow: auto;
    display: flex; align-items: center; justify-content: center;
  }
  .plan-placeholder {
    text-align: center; color: #94a3b8;
  }
  .plan-placeholder .title {
    font-size: 16px; font-weight: 600; color: #64748b; margin-bottom: 8px;
  }
  .plan-placeholder .hint {
    font-size: 13px; line-height: 1.6;
  }
</style>
</head>
<body>

<button class="plan-badge" onclick="openPlan()">
  <span class="dot"></span> Plan
</button>

<div class="modal-overlay" id="plan-modal">
  <div class="modal-box">
    <div class="plan-header">
      <h1>Plan View</h1>
      <button class="modal-close" onclick="closePlan()">✕ Close</button>
    </div>
    <div class="plan-body">
      <div class="plan-placeholder">
        <div class="title">Plan View — Skeleton</div>
        <div class="hint">
          มุมมองอ่านสรุป Plan (แยกจาก Plan Editor)<br>
          Editor: <code>plan_editor.html</code> · logic: <code>plan_manual.md</code>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
function openPlan() {
  document.getElementById('plan-modal').classList.add('show');
}
function closePlan() {
  document.getElementById('plan-modal').classList.remove('show');
}
document.getElementById('plan-modal').addEventListener('click', function (e) {
  if (e.target === this) closePlan();
});
</script>

</body>
</html>
